/* ============ Simpan lokal (IndexedDB, cadangan localStorage) ============ */
const IDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open('lei-stuff', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => { this.db = r.result; res(this.db); };
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
  },
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(k, v) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
};

  const can = STORE && STORE.ready && SYNC.status !== 'busy';

async function listVersions() {

    const list = await listVersions();
    const old = list.filter(f => f.id !== keepId).slice(KEEP_VERSIONS - 1);
    for (const f of old.slice(0, 4)) { try { await STORE.trash(f.id); } catch (e) { } }
  } catch (e) { }
}

function markDirty() {
  S.updatedAt = Date.now(); META.dirty = true; saveLocal(); ofaPublish();
  if (STORE && STORE.ready) {
    if (!SYNC.firstDirty) SYNC.firstDirty = Date.now();
    if (SYNC.status !== 'busy' && SYNC.status !== 'err') setSync('dirty');
    if (SYNC.status !== 'err') scheduleDrive(Math.max(1500, Math.min(45000, 180000 - (Date.now() - SYNC.firstDirty))));
  }
}
function scheduleDrive(ms) { clearTimeout(driveT); driveT = setTimeout(saveDrive, ms); }

async function saveDrive() {
  clearTimeout(driveT);
  if (!STORE || !STORE.ready) return;
  if (SYNC.busy) { SYNC.pending = true; return; }
  SYNC.busy = true; setSync('busy');
  const started = S.updatedAt;
  try {
    const f = await uploadJSON();
    META.fileId = f.id; META.remoteAt = Date.now();
    META.dirty = S.updatedAt > started;
    SYNC.firstDirty = META.dirty ? Date.now() : 0;
    saveLocal();
    setSync(META.dirty ? 'dirty' : 'ok', META.dirty ? null : 'Tersimpan di Drive · ' + new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }));
    cleanupVersions(f.id);
  } catch (e) { handleDriveErr(e, 'save'); }
  SYNC.busy = false;
  if (SYNC.pending || META.dirty) { SYNC.pending = false; if (META.dirty && SYNC.status !== 'err') scheduleDrive(45000); }
}

function handleDriveErr(e, phase) {
  const code = (e && e.code) || 'upstream_error';
  const safe = ' Tulisanmu tetap aman di perangkat ini.';
  if (code === 'needs_auth') setSync('err', 'Sesi Google berakhir. Masuk lagi untuk menyinkronkan.' + safe, 'relogin');
  else if (code === 'no_folder') setSync('err', 'Pilih folder Drive tempat Lei Stuff menyimpan tulisan.' + safe, 'folder');
  else if (code === 'offline') { setSync('offline', 'Offline · perubahan tersimpan di perangkat dan dikirim saat tersambung lagi'); }
  else if (code === 'not_configured') setSync('offline', 'Sambungan Google belum diatur di website ini. Tulisan hanya tersimpan di perangkat.');
  else if (code === 'needs_reauth') setSync('err', 'Google Drive perlu disambung ulang di claude.ai: Settings → Connectors.' + safe);
  else if (code === 'server_not_connected' || code === 'selection_required' || code === 'server_not_found') setSync('err', 'Tambahkan atau pilih Google Drive di claude.ai: Settings → Connectors.' + safe);
  else if (['approval_required', 'not_in_manifest', 'consent_required', 'not_granted', 'capability_disabled'].includes(code)) setSync('err', 'Halaman ini belum diizinkan memakai Google Drive.' + safe, 'allow');
  else if (code === 'blocked_by_policy') setSync('err', 'Google Drive diblokir oleh kebijakan akunmu.' + safe);
  else if (code === 'too_big') setSync('err', 'Data terlalu besar untuk disimpan sekaligus.' + safe);
  else if (code === 'tool_error') setSync('err', 'Drive menolak permintaan: ' + String(e.message || '').slice(0, 120) + '.' + safe, 'retry');
  else {
    setSync('err', 'Drive sedang tidak terjangkau. Mencoba lagi sebentar lagi.' + safe, 'retry');
    const wait = Math.min(60000, (e && e.retryAfterMs) || 30000) + Math.random() * 4000;
    if (phase === 'save') scheduleDrive(wait); else setTimeout(() => loadFromDrive(true), wait);
  }
}

function hasContent(s) { return s.pieces.length || s.contests.length || s.pubs.length || s.todos.length || s.notes.length || s.ideas.length; }

async function loadFromDrive(quiet) {
  if (!STORE || !STORE.ready) return;
  if (!quiet) setSync('busy', 'Memeriksa Drive…');
  SYNC.lastCheck = Date.now();
  try {
    const list = await listVersions();
    const newest = list[0];
    if (!newest) {
      if (hasContent(S) || META.dirty) await saveDrive(); else setSync('ok', 'Siap. Data akan tersimpan di folder Drive-mu.');
      return;
    }
    if (newest.id === META.fileId) { if (META.dirty) scheduleDrive(1500); else setSync('ok', 'Tersimpan di Drive'); return; }
    const remote = normalize(await downloadJSON(newest.id));
    if (META.dirty && hasContent(S)) {
      pendingRemote = { data: remote, id: newest.id, when: newest.modifiedTime };
      setSync('dirty', 'Ada dua versi berbeda. Pilih yang dipakai.');
      showConflict();
      return;
    }
    S = remote; META.fileId = newest.id; META.dirty = false; saveLocal();
    setSync('ok', 'Tersimpan di Drive');
    if (quiet) toast('Diperbarui dengan versi terbaru dari Drive');
    render();
  } catch (e) { handleDriveErr(e, 'load'); }
}
function showConflict() {
  const when = pendingRemote && pendingRemote.when ? new Date(pendingRemote.when).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }) : '';
  openDialog(`<h2>Ada dua versi yang berbeda</h2>
  <p class="muted" style="margin:0;line-height:1.6">Drive punya versi lebih baru (${esc(when)}), mungkin dari perangkat lain. Perangkat ini juga punya perubahan yang belum tersimpan ke Drive. Versi yang tidak dipilih tetap ada sebagai cadangan di folder Drive.</p>
  <div class="row" style="justify-content:flex-end"><button class="btn quiet" data-act="useLocal">Pakai versi perangkat ini</button><button class="btn" data-act="useRemote">Pakai versi Drive</button></div>`);
}
async function initSync() {
  STORE = (TARGET === 'web' && typeof makeGoogleStore === 'function') ? makeGoogleStore() : makeMcpStore();
  let ok = false;
  try { ok = await STORE.init(); } catch (e) { handleDriveErr(e, 'init'); render(); return; }
  render();
  if (ok) await loadFromDrive();
}
async function syncAction() {
  const a = SYNC.action;
  try {
    if (a === 'connect' || a === 'relogin') { await STORE.connect(); }
    else if (a === 'folder') { if (STORE.chooseFolder) await STORE.chooseFolder(); else await STORE.pickFolder(); }
    else if (a === 'allow' && STORE.kind === 'mcp') { STORE.ready = true; }
  } catch (e) { handleDriveErr(e, 'load'); return; }
  if (!STORE.ready) return;
  setSync('busy', 'Memeriksa Drive…');
  if (META.dirty && META.fileId) await saveDrive(); else await loadFromDrive();
}
document.addEventListener('visibilitychange', () => {
  if (!STORE || !STORE.ready) return;
  if (document.visibilityState === 'hidden') { if (META.dirty && !SYNC.busy) saveDrive(); }
  else if (!META.dirty && !SYNC.busy && Date.now() - SYNC.lastCheck > 60000) loadFromDrive(true);
});
window.addEventListener('online', () => { if (STORE && STORE.ready) { if (META.dirty) saveDrive(); else loadFromDrive(true); } });
window.addEventListener('offline', () => { if (STORE && STORE.kind === 'google') setSync('offline', 'Offline · perubahan tersimpan di perangkat dan dikirim saat tersambung lagi'); });

const pubTitle = x => { const p = x.pieceId && pieceById(x.pieceId); return p ? (p.title || 'Tanpa judul') : (x.title || 'Tanpa judul'); };

/* ============ Catatan dan to-do ============ */
function viewCatatan() {
  const f = U.cat.filter;
  const match = pid => f === 'Semua' || (f === 'umum' ? !pid : pid === f);
  const pidsUsed = Array.from(new Set(S.todos.map(t => t.pieceId).concat(S.notes.map(n => n.pieceId)).filter(Boolean))).filter(id => pieceById(id));
  const todos = S.todos.filter(t => match(t.pieceId)).sort((a, b) => (a.done - b.done) || (b.at - a.at));
  const notes = S.notes.filter(n => match(n.pieceId)).sort((a, b) => b.at - a.at);
  const ideas = S.ideas.slice().sort((a, b) => b.at - a.at);
  const pieceOpts = sel => `<option value="">Umum</option>${S.pieces.map(p => `<option value="${p.id}" ${sel === p.id ? 'selected' : ''}>${esc(p.title || 'Tanpa judul')}</option>`).join('')}`;
  return `<header class="between" style="align-items:flex-end"><h1>Catatan dan to-do</h1></header>
  <div class="row" style="gap:6px" role="group" aria-label="Saring menurut tulisan">${[['Semua', 'Semua'], ['umum', 'Umum']].concat(pidsUsed.map(id => [id, pieceById(id).title || 'Tanpa judul'])).map(([k, n]) => `<button class="pill" data-act="catFilter" data-k="${k}" aria-pressed="${f === k}">${esc(n)}</button>`).join('')}</div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;align-items:start">
   <section class="card col" aria-label="To-do"><div class="between"><h2>To-do</h2><span class="meta">${todos.filter(t => !t.done).length} belum selesai</span></div>
    <form class="col" data-form="todo" style="gap:8px"><div class="row" style="gap:8px;flex-wrap:nowrap"><label style="flex:1"><span class="sr">To-do baru</span><input class="in" id="tdText" placeholder="Tambah to-do" autocomplete="off"></label><button class="btn icon ghost" type="submit" aria-label="Tambah to-do" style="min-height:42px;min-width:42px">+</button></div>
     <div class="row" style="gap:8px;flex-wrap:nowrap"><label style="flex:1"><span class="sr">Untuk tulisan</span><select class="in" id="tdPiece">${pieceOpts(f !== 'Semua' && f !== 'umum' ? f : '')}</select></label><label><span class="sr">Tenggat</span><input class="in" type="date" id="tdDue" style="width:150px"></label></div></form>
    ${todos.map(todoRow).join('') || '<div class="empty">Belum ada to-do.</div>'}</section>
   <section class="card col" aria-label="Catatan"><div class="between"><h2>Catatan</h2><button class="btn sm ghost" data-act="noteDialog">Catatan baru</button></div>
    ${notes.map(n => `<button class="item col" style="align-items:stretch;gap:6px" data-act="noteDialog" data-id="${n.id}"><span class="t">${esc(n.title || 'Tanpa judul')}</span><span class="serif" style="font-size:14px;line-height:1.6;color:var(--ink2);white-space:pre-wrap">${esc((n.text || '').slice(0, 280))}${(n.text || '').length > 280 ? '…' : ''}</span><span class="between meta"><span class="chip ac">${n.pieceId && pieceById(n.pieceId) ? esc(pieceById(n.pieceId).title || 'Tanpa judul') : 'Umum'}</span><span>${new Date(n.at).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' })}</span></span></button>`).join('') || '<div class="empty">Belum ada catatan.</div>'}</section>
   <section class="card col" aria-label="Bank ide"><div class="between"><h2>Bank ide</h2><span class="meta">${ideas.length} ide</span></div>
    <form class="col" data-form="idea" style="gap:8px"><label><span class="sr">Ide baru</span><textarea class="in" id="idText" rows="2" placeholder="Tulis idemu"></textarea></label><div class="row" style="gap:8px;flex-wrap:nowrap"><label style="flex:1"><span class="sr">Jenis</span><select class="in" id="idType">${TYPES.map(t => `<option value="${t.k}" ${t.k === 'lain' ? 'selected' : ''}>${t.n}</option>`).join('')}</select></label><button class="btn ghost" type="submit">Simpan</button></div></form>
    ${ideas.map(i => `<div class="item col" style="align-items:stretch;gap:8px"><span class="serif" style="font-size:15px;line-height:1.55">${esc(i.text)}</span><span class="between"><span class="row meta" style="gap:6px">${icon(i.type || 'lain', 18)}${TYPE_NAME[i.type || 'lain']} · ${new Date(i.at).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' })}</span><span class="row" style="gap:4px"><button class="btn sm ghost" data-act="ideaToPiece" data-id="${i.id}">Jadikan tulisan</button><button class="mini" data-act="delIdea" data-id="${i.id}" aria-label="Hapus ide">✕</button></span></span></div>`).join('') || '<div class="empty">Bank ide masih kosong.</div>'}</section>

/* ============ Lomba ============ */
function viewLomba() {
  const L = U.lomba;
  const cs = S.contests.slice().sort((a, b) => (a.deadline || '9').localeCompare(b.deadline || '9'));
  const rows = cs.filter(c => L.filter === 'Semua' || c.status === L.filter);
  if (!L.sel || !contestById(L.sel)) L.sel = (rows[0] || cs[0] || {}).id || null;
  const d = L.sel && contestById(L.sel);
  const joined = S.contests.filter(c => ['Terkirim', 'Menang', 'Tidak lolos'].includes(c.status));
  const decided = S.contests.filter(c => ['Menang', 'Tidak lolos'].includes(c.status));
  const won = S.contests.filter(c => c.status === 'Menang');
  const g = {}; won.forEach(c => { const k = (c.genre || 'Lainnya').trim(); g[k] = (g[k] || 0) + 1; });
  const best = Object.entries(g).sort((a, b) => b[1] - a[1])[0];
  const gaps = S.contests.filter(c => c.sentAt && c.deadline).map(c => (parseD(c.deadline) - parseD(c.sentAt)) / 864e5);
  return `<header class="between" style="align-items:flex-end"><h1>Lomba</h1><button class="btn" data-act="contestDialog">Tambah lomba</button></header>
  ${ofaInboxHTML()}
  <section class="grid" aria-label="Rapor lomba">
   <div class="card stat"><span class="meta">Lomba diikuti</span><b>${joined.length}</b><span class="meta">terkirim, menang, atau tidak lolos</span></div>
   <div class="card stat"><span class="meta">Lolos atau menang</span><b style="color:var(--gd)">${won.length} ${decided.length ? `<small>· ${Math.round(won.length / decided.length * 100)}%</small>` : ''}</b><span class="meta">dari ${decided.length} yang sudah diumumkan</span></div>
   <div class="card stat"><span class="meta">Genre paling berhasil</span><b>${best ? esc(best[0]) : '<small>Belum ada</small>'}</b><span class="meta">${best ? best[1] + ' kali menang' : 'muncul setelah ada yang menang'}</span></div>
   <div class="card stat"><span class="meta">Jarak kirim sebelum tenggat</span><b>${gaps.length ? Math.round(gaps.reduce((a, b) => a + b, 0) / gaps.length) : '–'} <small>hari</small></b><span class="meta">rata-rata</span></div>
  </section>
  <div class="row" style="gap:6px" role="group" aria-label="Saring status">${['Semua'].concat(CSTAT).map(s => `<button class="pill" data-act="lombaFilter" data-s="${s}" aria-pressed="${L.filter === s}">${s}</button>`).join('')}</div>
  <div class="row" style="align-items:flex-start;gap:16px">
   <section class="col" style="flex:999 1 400px;min-width:0;gap:8px">${rows.map(c => { const n = daysTo(c.deadline), open = ['Mengincar', 'Disiapkan'].includes(c.status); const ps = S.pieces.filter(p => p.contestId === c.id); return `<button class="item" data-act="selContest" data-id="${c.id}" style="background:var(--s1);border:1px solid ${c.id === L.sel ? 'var(--ac)' : 'var(--ln)'}"><span class="grow"><span class="t" style="display:block">${esc(c.name)}</span><span class="meta">${esc(c.genre || 'Semua genre')} · ${fmtDate(c.deadline)}${ps.length ? ' · ' + ps.map(p => esc(p.title || 'Tanpa judul')).join(', ') : ''}</span></span><span class="row" style="gap:6px"><span class="chip ${CSTAT_CHIP[c.status]}">${c.status}</span>${open && n !== null && n >= 0 ? cdChip(n) : ''}</span></button>`; }).join('') || `<div class="empty">${S.contests.length ? 'Tidak ada lomba berstatus ini.' : 'Daftar lomba masih kosong. Catat nama, tenggat, dan tautan ketentuannya.'}</div>`}</section>
   ${d ? contestDetail(d) : ''}
  </div>`;
}
function calUrl(c) {
  const a = c.deadline.replace(/-/g, ''); const n = parseD(c.deadline); n.setDate(n.getDate() + 1); const b = dkey(n).replace(/-/g, '');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent('Tenggat: ' + c.name) + '&dates=' + a + '/' + b + '&details=' + encodeURIComponent((c.notes || '') + (c.link ? '\n\nKetentuan: ' + c.link : '') + '\n\nDicatat di Lei Stuff');
}
const CAL_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ac)" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
function calBlock(d) {
  const box = inner => `<div class="col" style="gap:8px;padding:12px;border-radius:12px;background:var(--s2)"><span class="row" style="gap:8px;font-weight:500;font-size:14px">${CAL_ICON}Google Calendar</span>${inner}</div>`;
  if (!(STORE && STORE.hasCalendar)) return box(`<span class="meta" style="line-height:1.5">Membuka Google Calendar dengan acara tenggat yang sudah terisi. Atur pengingatnya di sana, lalu simpan.</span><a class="btn sm ghost" style="align-self:flex-start" href="${esc(calUrl(d))}" target="_blank" rel="noopener">Tambahkan ke Google Calendar</a>`);
  const c = d.cal || {};
  if (!c.on) return box(`<span class="meta" style="line-height:1.5">Tenggat ini akan menjadi acara di kalendermu, lengkap dengan pengingat.</span><button class="btn sm ghost" style="align-self:flex-start" data-act="calLink" data-id="${d.id}">Tautkan ke Google Calendar</button>`);
  const rem = c.rem || [];
  return box(`<span style="font-size:14px;color:var(--sgt)">${c.eventId ? 'Tertaut · acara “Tenggat: ' + esc(d.name) + '” pada ' + fmtDate(d.deadline) : 'Menunggu tersambung ke Google…'}</span>
   <div class="row" style="gap:6px"><span class="meta">Ingatkan</span>${[7, 3, 1].map(n => `<button class="pill" data-act="calRem" data-id="${d.id}" data-n="${n}" aria-pressed="${rem.includes(n)}">${n} hari sebelum</button>`).join('')}</div>
   <span class="meta" style="line-height:1.5">Pengingat muncul pukul 09.00. Kalau tenggat atau nama lomba diubah di sini, acaranya ikut berubah.</span>
   <button class="btn sm quiet" style="align-self:flex-start" data-act="calUnlink" data-id="${d.id}">Lepas tautan</button>`);
}
function contestDetail(d) {
  const ps = S.pieces.filter(p => p.contestId === d.id);

  return `<aside class="card col" style="flex:1 1 320px;min-width:0" aria-label="Detail lomba">
   <div class="meta">${esc(d.genre || 'Semua genre')} · tenggat ${fmtDate(d.deadline)}${['Mengincar', 'Disiapkan'].includes(d.status) && d.deadline ? ' · ' + cdText(daysTo(d.deadline)) : ''}</div>

   <label class="f">Status<select class="in" data-ch="contestStatus" data-id="${d.id}">${CSTAT.map(s => `<option ${s === d.status ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
   ${d.notes ? `<div style="white-space:pre-wrap;font-size:14px;line-height:1.6;color:var(--ink2)">${esc(d.notes)}</div>` : ''}

   <div class="col" style="gap:6px"><span class="meta">Tulisan untuk lomba ini</span>${ps.map(p => `<button class="item" data-act="openPiece" data-id="${p.id}" style="padding:8px 12px">${icon(p.type, 18)}<span class="grow">${esc(p.title || 'Tanpa judul')}</span><span class="chip ${STAGE_CHIP[p.stage]}">${p.stage}</span></button>`).join('') || '<span class="meta">Belum ada. Hubungkan dari Ruang tulis lewat pilihan “Untuk lomba”.</span>'}</div>
   ${d.deadline && !fin ? calBlock(d) : ''}

     <div class="col" style="gap:8px;padding:12px;border-radius:12px;background:var(--s2)"><span style="font-weight:500;font-size:14px">Retrospeksi</span><a class="meta" href="#rak-karya" data-act="go" data-v="rak-karya">Tercatat otomatis di Jejak publikasi</a>
     <label class="f">Apa yang berhasil?<textarea class="in grow" data-in="contestF" data-id="${d.id}" data-k="good" rows="2">${esc(d.good || '')}</textarea></label>
     <label class="f">Yang mau diperbaiki di tulisan berikutnya<textarea class="in grow" data-in="contestF" data-id="${d.id}" data-k="better" rows="2">${esc(d.better || '')}</textarea></label></div>` : ''}
   <div class="row"><button class="btn sm ghost" data-act="contestDialog" data-id="${d.id}">Sunting</button><button class="btn sm danger" data-act="delContest" data-id="${d.id}">Hapus</button></div>
  </aside>`;
}

   <label class="f">Untuk tulisan<select class="in" id="nPiece"><option value="">Umum</option>${S.pieces.map(p => `<option value="${p.id}" ${n.pieceId === p.id ? 'selected' : ''}>${esc(p.title || 'Tanpa judul')}</option>`).join('')}</select></label>
   <div class="err" id="nErr" hidden>Isi judul atau isi catatan dulu.</div>
   <div class="between">${id ? `<button class="btn sm danger" data-act="delNote" data-id="${id}">Hapus</button>` : '<span></span>'}<span class="row"><button class="btn quiet" data-act="dlgClose">Batal</button><button class="btn" data-act="saveNote" data-id="${id || ''}">Simpan</button></span></div>`);

function targetDialog() {

  <div class="row" style="justify-content:flex-end"><button class="btn quiet" data-act="dlgClose">Batal</button><button class="btn" data-act="saveTarget">Simpan</button></div>`);
}

/* ============ Ruang tulis ============ */
const P = { mode: 0, left: 25 * 60, running: false, elapsed: 0, timer: null, words0: 0, startHour: 0, pieceId: null, sessionId: null };
const curPiece = () => U.edId && pieceById(U.edId);
function curScene(p) {
  let found = null;
  p.chapters.forEach(c => c.scenes.forEach(s => { if (s.id === U.sceneId) found = s; }));
  if (!found) { found = p.chapters[0].scenes[0]; U.sceneId = found.id; }
  return found;
}
function sceneChapter(p, sid) { return p.chapters.find(c => c.scenes.some(s => s.id === sid)); }

function viewTulis() {
  const p = curPiece();
  if (!p) return pickerHTML();
  const st = p.stage, lock = st === 'Persiapan' && !prepOK(p);
  const con = p.contestId && contestById(p.contestId);
  const head = `<div class="between"><button class="btn sm quiet" data-act="go" data-v="rak-karya">← Rak Karya</button><div class="row" style="gap:6px"><button class="btn sm ghost" data-act="exportWord">Ekspor ke Word</button><button class="btn sm danger" data-act="delPiece">Hapus</button></div></div>
  <label><span class="sr">Judul tulisan</span><input class="etitle" data-in="pTitle" value="${esc(p.title)}" placeholder="Judul tulisan"></label>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px">
   <label class="f">Jenis<select class="in" data-ch="pType">${TYPES.map(t => `<option value="${t.k}" ${t.k === p.type ? 'selected' : ''}>${t.n}</option>`).join('')}</select></label>
   <label class="f">Target jumlah kata<input class="in" type="number" min="0" step="100" data-in="pTarget" value="${esc(p.target)}" placeholder="Opsional"></label>
   <label class="f">Untuk lomba<select class="in" data-ch="pContest"><option value="">Tidak ada</option>${S.contests.map(c => `<option value="${c.id}" ${c.id === p.contestId ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
  </div>
  ${con ? `<div class="meta">Lomba: ${esc(con.name)}${con.deadline ? ' · ' + fmtDate(con.deadline) + ' (' + cdText(daysTo(con.deadline)) + ')' : ''}</div>` : ''}
  <nav class="stepper" aria-label="Tahap tulisan">${STAGES.map((s, i) => `<button class="stp ${s === st ? 'on' : ''} ${s !== 'Persiapan' && lock ? 'lock' : ''}" data-act="setStage" data-s="${s}" ${s === st ? 'aria-current="step"' : ''}>${i + 1}. ${s}${s === 'Persiapan' && st !== 'Persiapan' && prepOK(p) ? ' · selesai' : ''}${s !== 'Persiapan' && lock ? ' · terkunci' : ''}</button>`).join('')}</nav>`;
  return head + (st === 'Persiapan' ? prepPage(p, con) : writePage(p));
}
function pickerHTML() {
  const ps = S.pieces.slice().sort((a, b) => (a.stage === 'Terkirim') - (b.stage === 'Terkirim') || b.updatedAt - a.updatedAt);
  return `<header class="between" style="align-items:flex-end"><div><h1>Ruang tulis</h1><div class="meta" style="font-size:14px;margin-top:4px">Pilih tulisan untuk dilanjutkan.</div></div><button class="btn" data-act="newPiece">Tulisan baru</button></header>
  <section class="col" style="gap:8px">${ps.map(p => `<button class="item" data-act="openPiece" data-id="${p.id}">${icon(p.type, 22)}<span class="grow"><span class="t" style="display:block">${esc(p.title || 'Tanpa judul')}</span><span class="meta">${TYPE_NAME[p.type]} · ${nf(pieceWords(p))} kata</span></span><span class="chip ${STAGE_CHIP[p.stage]}">${p.stage}</span></button>`).join('') || '<div class="empty">Belum ada tulisan.</div>'}</section>`;
}

/* ---- Persiapan ---- */
function prepPage(p, con) {
  const sh = PREP[p.type] || PREP.lain, v = prepVals(p), sv = stepVals(p), it = prepItems(p);
  const target = +p.target || 0;
  const posTxt = r => r ? (target ? '≈ kata ' + nf(target * r[0] / 100) + '–' + nf(target * r[1] / 100) : r[0] + '–' + r[1] + '%') : '';
  return `<div class="row" style="align-items:flex-start;gap:18px">
  <section class="card col prepbox" style="flex:999 1 520px;min-width:0;gap:12px">
   <div><h2>${sh.title}</h2><p class="meta" style="font-size:14px;line-height:1.6;margin:6px 0 0">${esc(sh.intro)} Isi semua butir untuk membuka tahap menulis. Butir yang tidak relevan boleh diisi tanda “-”.</p></div>
   ${it.map((x, i) => `${x[3] ? `<div class="sec-h">${esc(x[3])}</div>` : ''}
    ${x[4] ? `<div class="pi"><span class="row" style="gap:4px 10px;align-items:baseline"><b style="font-weight:500">${i + 1}. ${esc(x[0])}</b><span class="meta" data-pst="${i}"></span></span><span class="meta">${esc(x[1])}</span>
      ${x[4].map((s, k) => `<label class="steprow"><span style="font-size:14px;color:var(--ink2);padding-top:8px">${esc(s[0])}<span style="display:block;font-size:12px;color:var(--ac)">${posTxt([s[1], s[2]])}</span></span><textarea class="in grow" rows="1" data-in="step" data-k="${k}">${esc(sv[k] || '')}</textarea></label>`).join('')}</div>`
    : `<label class="pi"><span class="row" style="gap:4px 10px;align-items:baseline"><b style="font-weight:500;color:var(--ink)">${i + 1}. ${esc(x[0])}</b>${x[2] ? `<span style="font-size:13px;color:var(--ac)">${posTxt(x[2])}</span>` : ''}<span class="meta" data-pst="${i}"></span></span><span class="meta">${esc(x[1])}</span><textarea class="in grow" rows="2" data-in="prep" data-i="${i}">${esc(v[i] || '')}</textarea></label>`}`).join('')}
   <div class="between" style="padding:14px 16px;border-radius:12px;background:var(--s2)"><div style="flex:1 1 200px"><div id="pc" style="font-size:14px"></div><div class="bar" style="margin-top:8px"><i id="pcb"></i></div></div><button class="btn" data-act="finishPrep">Selesaikan persiapan, mulai menulis</button></div>
   <div class="err" id="prepErr" role="alert" hidden>Masih ada butir kosong. Isi dulu, atau beri tanda “-” jika tidak relevan.</div>
  </section>
  <aside class="col" style="flex:1 1 260px;min-width:0">
   ${con ? `<div class="card soft col" style="gap:6px"><span class="meta">Ketentuan lomba</span><b style="font-weight:500">${esc(con.name)}</b>${con.notes ? `<div style="white-space:pre-wrap;font-size:14px;line-height:1.6;color:var(--ink2)">${esc(con.notes)}</div>` : '<span class="meta">Belum ada catatan ketentuan.</span>'}${con.link ? `<a href="${esc(safeUrl(con.link))}" target="_blank" rel="noopener" style="font-size:14px">Buka halaman ketentuan</a>` : ''}</div>` : ''}
   <label class="card soft f">Catatan riset dan ide<textarea class="in grow" rows="3" data-in="pNotes">${esc(p.notes)}</textarea></label>
  </aside></div>`;
}
function updatePrepGate() {
  const p = curPiece(); if (!p) return;
  const it = prepItems(p), d = prepDone(p);
  const pc = $('#pc'); if (pc) pc.textContent = d + ' dari ' + it.length + ' butir terisi';
  const pcb = $('#pcb'); if (pcb) pcb.style.width = Math.round(d / it.length * 100) + '%';
  it.forEach((x, i) => { $$(`[data-pst="${i}"]`).forEach(el => { const ok = prepItemOk(p, x, i); el.textContent = ok ? 'terisi' : 'belum diisi'; el.style.color = ok ? 'var(--sg)' : 'var(--tc)'; }); });
  if (d === it.length) { const e = $('#prepErr'); if (e) e.hidden = true; }
}

/* ---- Menulis / Editorial / Terkirim ---- */
function writePage(p) {
  const L = U.ed.left, R = U.ed.right, st = p.stage, sc = curScene(p);
  const binder = `<div class="pwrap" style="flex-basis:${L ? 230 : 44}px"><aside class="panel binder" data-swipe="left" aria-label="Bab dan adegan" ${L ? '' : 'aria-hidden="true"'} style="width:230px;transform:translateX(${L ? 0 : -230}px)">
   <div class="between" style="padding:2px 4px 6px"><span class="meta">Naskah</span><span class="row" style="gap:2px"><button class="mini" data-act="addChapter" aria-label="Tambah bab" title="Tambah bab">+</button><button class="mini" data-act="hideL" aria-label="Sembunyikan panel naskah" title="Sembunyikan">‹</button></span></div>
   ${p.chapters.map((c, ci) => `<div><div class="ch"><span title="${esc(c.title)}">${esc(c.title || 'Tanpa judul')}</span><button class="mini" data-act="renChapter" data-id="${c.id}" aria-label="Ganti nama bab">✎</button><button class="mini" data-act="addScene" data-id="${c.id}" aria-label="Tambah adegan">+</button>${ci > 0 ? `<button class="mini" data-act="moveChapter" data-id="${c.id}" data-d="-1" aria-label="Naikkan bab">↑</button>` : ''}${p.chapters.length > 1 ? `<button class="mini" data-act="delChapter" data-id="${c.id}" aria-label="Hapus bab">✕</button>` : ''}</div>
     ${c.scenes.map((s, si) => `<div class="row" style="gap:0;flex-wrap:nowrap"><button class="sc" data-act="pickScene" data-id="${s.id}" ${s.id === sc.id ? 'aria-current="true"' : ''}><span style="width:8px;height:8px;border-radius:50%;flex:0 0 8px;background:${htmlText(s.html).trim() ? 'var(--ac)' : 'var(--ln2)'}"></span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.title || 'Tanpa judul')}</span></button>${s.id === sc.id ? `${si > 0 ? `<button class="mini" data-act="moveScene" data-id="${s.id}" data-d="-1" aria-label="Naikkan adegan">↑</button>` : ''}${(c.scenes.length > 1 || p.chapters.length > 1) ? `<button class="mini" data-act="delScene" data-id="${s.id}" aria-label="Hapus adegan">✕</button>` : ''}` : ''}</div>`).join('')}</div>`).join('')}
   </aside><button class="strip" data-act="showL" data-swipe="lstrip" aria-label="Tampilkan panel naskah" style="opacity:${L ? 0 : 1};pointer-events:${L ? 'none' : 'auto'}"><span>›</span><span class="v">Naskah</span></button></div>`;
  const chk = CHECKS[st] ? `<div class="card soft col" style="gap:4px;padding:14px 16px"><b style="font-weight:500;font-size:14px">Daftar periksa ${st.toLowerCase()}</b>${CHECKS[st].map((t, i) => `<label class="row" style="gap:10px;min-height:32px;font-size:14px;color:var(--ink2);cursor:pointer;flex-wrap:nowrap"><input type="checkbox" data-ch="check" data-k="${st}:${i}" ${p.checks[st + ':' + i] ? 'checked' : ''} style="width:18px;height:18px;accent-color:var(--ac)">${t}</label>`).join('')}</div>` : '';
  const gate = st === 'Menulis' ? `<div class="between card soft" style="padding:12px 16px"><span class="meta">Selesai menulis draf? Lanjutkan ke penyuntingan.</span><button class="btn" data-act="setStage" data-s="Editorial">Lanjut ke Editorial</button></div>`
    : st === 'Editorial' ? `<div class="between card soft" style="padding:12px 16px"><span class="meta">Sudah disunting dan dikirim?</span><button class="btn" data-act="markSent">Tandai sudah terkirim</button></div>`
    : `<div class="between card soft" style="padding:12px 16px"><span class="meta">Tulisan ini sudah terkirim. Catat tempat terbitnya di Jejak publikasi.</span><button class="btn ghost" data-act="pubFor" data-id="${p.id}">Lihat Jejak publikasi</button></div>`;
  const todos = S.todos.filter(t => t.pieceId === p.id).sort((a, b) => (a.done - b.done) || (b.at - a.at));
  const todoCard = `<div class="card soft col" style="gap:6px;padding:14px 16px"><div class="between"><b style="font-weight:500;font-size:14px">To-do tulisan ini</b><a class="meta" href="#catatan" data-act="go" data-v="catatan">Semua to-do</a></div>
   <form class="row" data-form="edTodo" style="gap:8px;flex-wrap:nowrap"><label style="flex:1"><span class="sr">To-do baru</span><input class="in" id="etText" placeholder="Tambah to-do tanpa meninggalkan naskah" autocomplete="off"></label><button class="btn icon ghost" type="submit" aria-label="Tambah to-do" style="min-height:42px;min-width:42px">+</button></form>${todos.map(todoRow).join('')}</div>`;
  const rub = (st === 'Editorial' || st === 'Terkirim') ? `<div class="card soft col" style="gap:8px;padding:14px 16px"><div class="between"><b style="font-weight:500;font-size:14px">Rubrik penilaian diri</b><span class="meta">klik kotak untuk menilai 1–5</span></div>${RUBRIC.map(r => `<div class="row" style="gap:12px;flex-wrap:nowrap"><span style="width:90px;font-size:14px;color:var(--ink2)">${r}</span><span class="pipgrid">${[1, 2, 3, 4, 5].map(n => `<button class="pip ${(p.rubric[r] || 0) >= n ? 'on' : ''}" data-act="rub" data-k="${r}" data-n="${n}" aria-label="${r} ${n}"></button>`).join('')}</span></div>`).join('')}</div>` : '';
  const center = `<section class="ecol" aria-label="Editor">
   <div class="tbar" role="toolbar" aria-label="Format teks">
    <button class="tb" data-keep data-act="fmt" data-c="bold" aria-label="Tebal" style="font-weight:700">B</button><button class="tb" data-keep data-act="fmt" data-c="italic" aria-label="Miring" style="font-family:Lora,serif;font-style:italic">I</button>
    <button class="tb" data-keep data-act="fmt" data-c="h2">Judul</button><button class="tb" data-keep data-act="fmt" data-c="blockquote">Kutipan</button><button class="tb" data-keep data-act="fmt" data-c="p">Paragraf</button><button class="tb" data-keep data-act="fmt" data-c="hr">Pemisah</button><button class="tb" data-keep data-act="addFn"><sup style="color:var(--act)">1</sup> Catatan kaki</button>
    <span style="flex:1"></span>
    <span style="position:relative"><button class="btn sm ${P.running ? '' : 'ghost'}" id="pchip" data-act="pomoToggle" aria-expanded="${U.ed.pomoOpen}" style="font-variant-numeric:tabular-nums">${pomoChip()}</button>${U.ed.pomoOpen ? pomoPop() : ''}</span>
    <button class="btn sm ${!L && !R ? '' : 'ghost'}" data-act="wide" aria-pressed="${!L && !R}">${!L && !R ? 'Tampilkan panel' : 'Mode lebar'}</button>
   </div>
   <article class="paper"><div class="meta">${esc(sceneChapter(p, sc.id).title)}</div><label><span class="sr">Judul adegan</span><input class="scene-h" data-in="sceneTitle" value="${esc(sc.title)}" placeholder="Judul adegan"></label>
    <div class="ed" id="ed" contenteditable="true" spellcheck="true" data-ph="Mulai menulis di sini…" role="textbox" aria-multiline="true" aria-label="Naskah"></div>
    <div class="fnl" id="fnl" hidden></div></article>
   <div class="between meta" style="padding:0 4px"><span id="wline"></span><span id="tline"></span></div>
   ${U.reflect ? reflectCard() : ''}
   ${chk}${rub}${gate}${todoCard}
  </section>`;
  const tabs = [['prep', 'Persiapan'], ['notes', 'Catatan'], ['chars', 'Tokoh']];
  const right = `<div class="pwrap" style="flex-basis:${R ? 300 : 44}px"><aside class="panel" data-swipe="right" aria-label="Panel samping" ${R ? '' : 'aria-hidden="true"'} style="width:300px;transform:translateX(${R ? 0 : 300}px)">
   <div class="row" style="gap:6px;flex-wrap:nowrap"><button class="mini" data-act="hideR" aria-label="Sembunyikan panel samping" title="Sembunyikan">›</button><div class="tabs" role="tablist" style="flex:1">${tabs.map(t => `<button role="tab" aria-selected="${U.ed.tab === t[0]}" data-act="edTab" data-t="${t[0]}">${t[1]}</button>`).join('')}</div></div>
   ${U.ed.tab === 'prep' ? sidePrep(p) : U.ed.tab === 'notes' ? sideNotes(p) : sideChars(p)}
  </aside><button class="strip" data-act="showR" data-swipe="rstrip" aria-label="Tampilkan panel samping" style="opacity:${R ? 0 : 1};pointer-events:${R ? 'none' : 'auto'}"><span>‹</span><span class="v">Persiapan · Catatan · Tokoh</span></button></div>`;
  return `<div class="ews">${binder}${center}${right}</div>`;
}
function sidePrep(p) {
  const it = prepItems(p), v = prepVals(p), sv = stepVals(p), tg = +p.target || 0;
  const pos = (a, b) => tg ? '≈ ' + nf(tg * a / 100) + '–' + nf(tg * b / 100) : a + '–' + b + '%';
  const con = p.contestId && contestById(p.contestId);
  let h = `${con ? `<div class="meta">Lomba: ${esc(con.name)}${con.deadline ? ' · ' + cdText(daysTo(con.deadline)) : ''}</div>` : ''}<div class="meta">${(PREP[p.type] || PREP.lain).title}. ${tg ? 'Bingkai menandai perkiraan posisi naskahmu sekarang.' : 'Isi target kata untuk melihat posisi naskahmu.'}</div>`;
  it.forEach((x, i) => {
    if (x[4]) x[4].forEach((s, k) => { h += `<div class="pcardx" data-pa="${s[1]}" data-pb="${s[2]}"><div class="between" style="font-size:13px"><b style="font-weight:500">${i + 1}. ${esc(s[0])}</b><span class="meta">${pos(s[1], s[2])}</span></div><textarea rows="1" data-in="step" data-k="${k}" placeholder="${esc(x[1])}">${esc(sv[k] || '')}</textarea></div>`; });
    else h += `<div class="pcardx" ${x[2] ? `data-pa="${x[2][0]}" data-pb="${x[2][1]}"` : ''}><div class="between" style="font-size:13px"><b style="font-weight:500">${i + 1}. ${esc(x[0])}</b>${x[2] ? `<span class="meta">${pos(x[2][0], x[2][1])}</span>` : ''}</div><textarea rows="1" data-in="prep" data-i="${i}" placeholder="${esc(x[1])}">${esc(v[i] || '')}</textarea></div>`;
  });
  return h;
}
function sideNotes(p) {
  const ns = S.notes.filter(n => n.pieceId === p.id);
  return `<label class="f">Catatan riset dan ide<textarea class="in grow" rows="5" data-in="pNotes">${esc(p.notes)}</textarea></label>
  ${ns.map(n => `<button class="item col" style="align-items:stretch;gap:4px;padding:10px 12px" data-act="noteDialog" data-id="${n.id}"><span class="t" style="font-size:14px">${esc(n.title || 'Tanpa judul')}</span><span class="serif" style="font-size:13px;color:var(--ink2)">${esc((n.text || '').slice(0, 140))}</span></button>`).join('')}
  <button class="btn sm ghost" data-act="noteForPiece">Catatan baru untuk tulisan ini</button>`;
}
function sideChars(p) {
  return `${p.chars.map(c => `<div class="pcardx col" style="gap:4px"><div class="row" style="gap:4px;flex-wrap:nowrap"><label style="flex:1"><span class="sr">Nama tokoh</span><input class="in" style="min-height:34px;font-weight:500" data-in="charF" data-id="${c.id}" data-k="name" value="${esc(c.name)}" placeholder="Nama"></label><button class="mini" data-act="delChar" data-id="${c.id}" aria-label="Hapus tokoh">✕</button></div>
   ${[['role', 'Peran'], ['ideal', 'Idealisme atau keinginan'], ['family', 'Latar keluarga'], ['note', 'Ciri khas dan catatan']].map(([k, l]) => `<label class="f" style="gap:2px">${l}<textarea rows="1" data-in="charF" data-id="${c.id}" data-k="${k}">${esc(c[k] || '')}</textarea></label>`).join('')}</div>`).join('') || '<div class="meta">Belum ada tokoh.</div>'}
  <button class="btn sm ghost" data-act="addChar">Tambah tokoh</button>`;
}
function reflectCard() {
  const r = U.reflect;
  return `<div class="card col" style="border-color:var(--ac);gap:10px" role="status"><div class="between"><span class="serif" style="font-size:18px">Sesi selesai. Bagaimana tadi?</span><span class="meta">${fmtDur(r.sec)} · +${nf(r.words)} kata</span></div>
   <div class="row" style="gap:6px">${['Lancar', 'Biasa', 'Tersendat'].map(f => `<button class="pill" data-act="rfFeel" data-f="${f}" aria-pressed="${r.feel === f}">${f}</button>`).join('')}</div>
   <div class="row" style="gap:6px"><span class="meta" style="margin-right:4px">Energi</span>${[1, 2, 3, 4, 5].map(n => `<button class="pill" style="min-width:38px" data-act="rfEnergy" data-n="${n}" aria-pressed="${r.energy >= n}">${n}</button>`).join('')}</div>
   <label class="f">Ada hambatan? (opsional)<input class="in" id="rfBlock" value="${esc(r.block || '')}" placeholder="Bingung transisi antaradegan"></label>
   <div class="row" style="justify-content:flex-end"><button class="btn quiet sm" data-act="rfSkip">Lewati</button><button class="btn sm" data-act="rfSave">Simpan ke rapor</button></div></div>`;
}

/* ---- Pomodoro ---- */
const pomoDurs = () => S.settings.pomo.durs;
const clockTxt = () => pad(Math.floor(P.left / 60)) + ':' + pad(P.left % 60);
function pomoChip() { const c = S.settings.pomo.cycle; return (P.running ? '❚❚ ' : '▶ ') + clockTxt() + ' · sesi ' + ((sessionsToday() % c) + 1) + '/' + c; }
function sessionsToday() { return S.sessions.filter(s => s.date === today()).length; }
function pomoPop() {
  const D = pomoDurs(), ps = U.pset;

function analyze(text) {

/* ============ Jembatan dengan One for All (Ofa) ============
   Lei Stuff dan Ofa sama-sama tinggal di sitilutfiyah821.github.io, jadi berbagi penyimpanan di perangkat yang sama.
   - Lei Stuff menulis jadwal lombanya ke 'leistuff-ke-ofa-v1' (hanya kunci ini yang ditulis Lei Stuff).
     Tiap lomba menjadi sampai tiga jadwal: batas pendaftaran, batas kirim karya, dan pengumuman.
   - Lei Stuff membaca data Ofa ('ofa-data-v1') untuk kotak "Dari Ofa": jadwal lomba yang dicatat di Ofa
     (misalnya dari poster Instagram) dan belum ada di Lei Stuff. Saat dijadikan lomba, id jadwal Ofa dikirim
     balik sebagai 'gantikan', supaya Ofa tidak menggandakan jadwalnya. */
const OFA_OUT = 'leistuff-ke-ofa-v1';
const OFA_IN = 'ofa-data-v1';
const OFA_URL = 'https://sitilutfiyah821.github.io/one-for-all/';
const LEI_URL = 'https://sitilutfiyah821.github.io/lei-stuff/';
const OFA_PARTS = [['daftar', 'regDate', 'Daftar'], ['kirim', 'deadline', 'Kirim karya'], ['umum', 'announce', 'Pengumuman']];
const OFA_ON = () => TARGET === 'web';

function ofaJadwal() {
  const out = [];
  S.contests.forEach(c => {
    const sent = ['Terkirim', 'Menang', 'Tidak lolos'].includes(c.status);
    const decided = ['Menang', 'Tidak lolos'].includes(c.status);
    const note = [c.genre ? 'Genre/tema: ' + c.genre : '', c.link ? 'Ketentuan: ' + c.link : '', (c.notes || '').slice(0, 300)].filter(Boolean).join('\n');
    OFA_PARTS.forEach(([k, f, label]) => {
      if (!c[f]) return;
      const it = { id: c.id + '-' + k, judul: label + ': ' + c.name, tanggal: c[f], catatan: note, link: LEI_URL + '#lomba/' + c.id, selesai: k === 'umum' ? decided : sent };
      if (c.dariOfa && c.dariOfa[k]) it.gantikan = c.dariOfa[k];
      it.versi = [it.judul, it.tanggal, it.catatan, it.selesai ? 1 : 0].join('|');
      out.push(it);
    });
  });
  return out;
}
let ofaLast = '';
function ofaPublish() {
  if (!OFA_ON()) return;
  const jadwal = ofaJadwal(); const body = JSON.stringify(jadwal);
  if (body === ofaLast) return;
  ofaLast = body;
  try { localStorage.setItem(OFA_OUT, JSON.stringify({ v: 1, waktu: new Date().toISOString(), jadwal })); } catch (e) { }
}

/* Jadwal lomba di Ofa yang belum ada di Lei Stuff, dikelompokkan per nama lomba. */
function ofaInbox() {
  if (!OFA_ON()) return [];
  let d = null; try { d = JSON.parse(localStorage.getItem(OFA_IN) || 'null'); } catch (e) { return []; }
  if (!d || !Array.isArray(d.tasks) || !Array.isArray(d.projects)) return [];
  const lomba = new Set(d.projects.filter(p => p.kind === 'lomba' || p.id === 'lei-stuff').map(p => p.id));
  const used = new Set(S.ofaHidden || []);
  S.contests.forEach(c => Object.values(c.dariOfa || {}).forEach(id => used.add(id)));
  const groups = new Map();
  d.tasks.forEach(t => {
    if (!lomba.has(t.projectId) || t.dariLei || t.dariNiras || t.done || t.skipped || used.has(t.id) || !t.date) return;
    if (daysTo(t.date) < -1) return;
    const m = /^(Daftar|Kirim karya|Pengumuman):\s*(.+)$/i.exec(t.title || '');
    const kind = m ? { daftar: 'daftar', 'kirim karya': 'kirim', pengumuman: 'umum' }[m[1].toLowerCase()] : 'kirim';
    const name = (m ? m[2] : t.title || '').trim(); if (!name) return;
    const key = name.toLowerCase() + '|' + (t.link || '');
    const g = groups.get(key) || { name, link: t.link || '', note: t.note || '', ids: {}, dates: {} };
    if (!g.ids[kind]) { g.ids[kind] = t.id; g.dates[kind] = t.date; }
    groups.set(key, g);
  });
  return Array.from(groups.values()).sort((a, b) => (a.dates.kirim || a.dates.daftar || a.dates.umum || '').localeCompare(b.dates.kirim || b.dates.daftar || b.dates.umum || ''));
}

function ofaInboxHTML() {
  const list = ofaInbox(); if (!list.length) return '';
  U.ofaList = list;
  return `<section class="card col" style="gap:10px" aria-label="Jadwal lomba dari Ofa">
   <div class="between"><h3>Dari Ofa</h3><a class="meta" href="${OFA_URL}" target="_blank" rel="noopener">Buka Ofa</a></div>
   <span class="meta">Jadwal lomba yang kamu catat di Ofa dan belum ada di sini.</span>

/* ============ Adapter: Google Drive + Calendar langsung (versi website) ============
   Memakai Google Identity Services (token di browser, tanpa server) dan Google Picker.
   Konfigurasi di window.LEI_CONFIG = { clientId, apiKey, projectNumber } (src/config.js). */
const G_SCOPES = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/calendar.events';
const loadScript = src => new Promise((res, rej) => { if ($$('script').some(s => s.src === src)) return res(); const s = document.createElement('script'); s.src = src; s.async = true; s.onload = res; s.onerror = () => rej({ code: navigator.onLine ? 'upstream_error' : 'offline' }); document.head.appendChild(s); });

function makeGoogleStore() {
  const CFG = window.LEI_CONFIG || {};
  let token = null, tokenExp = 0, tokenClient = null, pending = null;
  const folder = () => { if (!META.folderId) { META.folderOk = false; throw { code: 'no_folder' }; } return META.folderId; };

  async function ensureGis() {
    if (tokenClient) return;
    await loadScript('https://accounts.google.com/gsi/client');
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CFG.clientId, scope: G_SCOPES, include_granted_scopes: true,
      callback: r => { const p = pending; pending = null; if (!p) return; if (r.error) p.rej({ code: 'needs_auth', message: r.error }); else p.res(r); },
      error_callback: e => { const p = pending; pending = null; if (p) p.rej({ code: 'needs_auth', message: e && e.type }); }
    });
  }
  async function getToken(prompt) {
    await ensureGis();
    const r = await new Promise((res, rej) => { pending = { res, rej }; tokenClient.requestAccessToken({ prompt }); });
    if (!google.accounts.oauth2.hasGrantedAllScopes(r, 'https://www.googleapis.com/auth/drive.file')) throw { code: 'tool_error', message: 'Izin Google Drive tidak diberikan' };
    token = r.access_token; tokenExp = Date.now() + (r.expires_in || 3600) * 1000;
    return token;
  }
  async function api(method, url, body, headers = {}, asText = false) {
    if (!token || Date.now() > tokenExp - 60000) { token = null; store.ready = false; throw { code: 'needs_auth' }; }
    let r;
    try { r = await fetch(url, { method, headers: Object.assign({ Authorization: 'Bearer ' + token }, headers), body }); }
    catch (e) { throw { code: navigator.onLine ? 'upstream_error' : 'offline' }; }
    if (r.status === 401) { token = null; store.ready = false; throw { code: 'needs_auth' }; }
    if (!r.ok) {
      let msg = ''; try { const j = await r.json(); msg = (j.error && j.error.message) || ''; } catch (e) { }
      throw { code: r.status === 404 ? 'not_found' : r.status >= 500 || r.status === 429 ? 'upstream_error' : 'tool_error', status: r.status, message: msg };
    }
    if (r.status === 204) return null;
    return asText ? r.text() : r.json();
  }
  async function loadPicker() {
    await loadScript('https://apis.google.com/js/api.js');
    await new Promise(res => gapi.load('picker', res));
  }
  function picker(view, title) {
    return new Promise(res => {
      const p = new google.picker.PickerBuilder()
        .setOAuthToken(token).setDeveloperKey(CFG.apiKey).setAppId(String(CFG.projectNumber || ''))
        .addView(view).setLocale('id').setTitle(title)
        .setCallback(d => { const a = d[google.picker.Response.ACTION]; if (a === google.picker.Action.PICKED) res(d[google.picker.Response.DOCUMENTS] || []); else if (a === google.picker.Action.CANCEL) res(null); })
        .build();
      p.setVisible(true);
    });
  }

  const store = {
    kind: 'google', ready: false, hasCalendar: true,
    async init() {
      if (!CFG.clientId) throw { code: 'not_configured' };
      // Muat skrip Google lebih awal agar jendela login dibuka langsung saat tombol diklik (tidak diblokir browser).
      ensureGis().catch(() => { }); loadPicker().catch(() => { });
      if (!META.gConnected) { setSync('offline', 'Belum tersambung ke Google Drive. Tulisan tersimpan di perangkat ini.', 'connect'); return false; }
      setSync('offline', 'Tulisan tersimpan di perangkat. Ketuk untuk menyinkronkan dengan Drive.', 'relogin');
      return false;
    },
    async connect() {
      await getToken(META.gConnected ? '' : 'consent');
      META.gConnected = true; saveLocal();
      if (!META.folderOk) await this.chooseFolder();
      this.ready = true;
    },
    /* Pengguna baru: buat folder "Lei Stuff" otomatis. Pengguna lama: pilih folder berisi data sebelumnya. */
    async chooseFolder() {
      const v = await new Promise(res => {
        openDialog(`<h2>Simpan tulisanmu di mana?</h2>
          <p class="meta">Lei Stuff menyimpan salinan tulisanmu di Google Drive milikmu sendiri. Hanya kamu yang bisa membukanya.</p>
          <div class="col" style="gap:8px;margin-top:12px">
            <button class="btn" data-act="dlgPick" data-v="new">Buat folder baru “Lei Stuff” di Drive-ku</button>
            <button class="btn quiet" data-act="dlgPick" data-v="old">Aku sudah punya folder Lei Stuff (pilih folder lama)</button>
          </div>`);
        dlgResolve = res;
      });
      if (v === 'new') return this.ensureAppFolder();
      if (v === 'old') return this.pickFolder();
      throw { code: 'no_folder' };
    },
    async ensureAppFolder() {
      if (!token) await getToken('');
      const q = encodeURIComponent("mimeType = 'application/vnd.google-apps.folder' and name = 'Lei Stuff' and trashed = false");
      const j = await api('GET', `https://www.googleapis.com/drive/v3/files?q=${q}&pageSize=1&fields=files(id,name)&spaces=drive`);
      let id = j.files && j.files[0] && j.files[0].id;
      if (!id) {
        const r = await api('POST', 'https://www.googleapis.com/drive/v3/files?fields=id', JSON.stringify({ name: 'Lei Stuff', mimeType: 'application/vnd.google-apps.folder' }), { 'Content-Type': 'application/json' });
        id = r.id;
      }
      META.folderId = id; META.folderOk = true; saveLocal();
      this.ready = true;
      toast('Folder “Lei Stuff” siap di Google Drive-mu');
    },
    async pickFolder() {
      if (!token) await getToken('');
      await loadPicker();
      const fv = new google.picker.DocsView(google.picker.ViewId.FOLDERS).setIncludeFolders(true).setSelectFolderEnabled(true).setMode(google.picker.DocsViewMode.LIST);
      const f = await picker(fv, 'Pilih folder Lei Stuff-mu yang lama');
      if (!f || !f[0]) throw { code: 'no_folder' };
      META.folderId = f[0].id; META.folderOk = true; saveLocal();
      // Beri izin baca untuk file data lama (mis. dari versi artifact) di folder itu.
      const dv = new google.picker.DocsView(google.picker.ViewId.DOCS).setParent(META.folderId).setMode(google.picker.DocsViewMode.LIST).setQuery(FILE_PREFIX);
      await picker(dv, 'Pilih file lei-stuff-data terbaru di folder itu (lewati jika tidak ada)');
      this.ready = true;
    },
    async list() {
      const q = encodeURIComponent(`'${folder()}' in parents and name contains '${FILE_PREFIX}' and trashed = false`);
      try {
        const j = await api('GET', `https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=modifiedTime%20desc&pageSize=30&fields=files(id,name,modifiedTime)&spaces=drive`);
        return (j.files || []).map(f => ({ id: f.id, title: f.name, modifiedTime: f.modifiedTime }));
      } catch (e) { if (e.code === 'not_found') { META.folderOk = false; throw { code: 'no_folder' }; } throw e; }
    },
    async download(id) { return api('GET', `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(id)}?alt=media`, null, {}, true); },
    async upload(text, title) {
      const b = 'leistuff' + Math.random().toString(36).slice(2);
      const meta = { name: title, parents: [folder()], mimeType: 'application/json' };
      const body = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${text}\r\n--${b}--`;
      try { return await api('POST', 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,modifiedTime', body, { 'Content-Type': 'multipart/related; boundary=' + b }); }
      catch (e) { if (e.code === 'not_found' || e.status === 403) { META.folderOk = false; throw { code: 'no_folder' }; } throw e; }
    },
    async trash(id) { await api('PATCH', `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(id)}`, JSON.stringify({ trashed: true }), { 'Content-Type': 'application/json' }); },
    async calUpsert(c) {
      const n = parseD(c.deadline); n.setDate(n.getDate() + 1);
      const ev = {
        summary: 'Tenggat: ' + c.name,
        description: (c.notes || '') + (c.link ? '\n\nKetentuan: ' + c.link : '') + '\n\nDicatat di Lei Stuff',
        start: { date: c.deadline }, end: { date: dkey(n) },
        reminders: { useDefault: false, overrides: (c.cal.rem || []).slice().sort((a, b) => b - a).map(d => ({ method: 'popup', minutes: d * 1440 - 540 })) }
      };
      const base = 'https://www.googleapis.com/calendar/v3/calendars/primary/events';
      if (c.cal.eventId) {
        try { const r = await api('PATCH', base + '/' + encodeURIComponent(c.cal.eventId), JSON.stringify(ev), { 'Content-Type': 'application/json' }); return r.id; }
        catch (e) { if (!(e.code === 'not_found' || e.status === 410)) throw e; }
      }
      const r = await api('POST', base, JSON.stringify(ev), { 'Content-Type': 'application/json' });
      return r.id;
    },
    async calDelete(c) {
      if (!c.cal || !c.cal.eventId) return;
      try { await api('DELETE', 'https://www.googleapis.com/calendar/v3/calendars/primary/events/' + encodeURIComponent(c.cal.eventId)); }
      catch (e) { if (!(e.code === 'not_found' || e.status === 410)) throw e; }
    }
  };
  return store;
}

function render() {

  if (v === 'ruang-tulis') mountEditor(); else $$('textarea.grow').forEach(grow);
  if (focusSel) { const el = $(focusSel); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }

function go(v, push = true) {
  if (!VIEWS.some(x => x[0] === v)) v = 'beranda';
  leaveEditor();
  U.view = v; U.ed.pomoOpen = false;

  render(); window.scrollTo(0, 0);
}
function leaveEditor() {
  const p = curPiece();

    cleanFootnotes(p);
    const empty = !p.title && !pieceWords(p) && !(p.notes || '').trim() && !Object.values(p.prep).some(o => Object.values(o).some(x => (x || '').trim())) && !Object.values(p.steps).some(a => (a || []).some(x => (x || '').trim()));

  }

function openPiece(id) {
  const p = pieceById(id); if (!p) return;

}

  exportWord: () => { const p = curPiece(); if (p) { cleanFootnotes(p); exportWord(p); } },
  pickScene: t => { U.sceneId = t.dataset.id; render(); },
  addChapter: () => { const p = curPiece(); const s = { id: uid(), title: 'Adegan 1', html: '' }; p.chapters.push({ id: uid(), title: 'Bab ' + (p.chapters.length + 1), scenes: [s] }); U.sceneId = s.id; touch(p); render(); },
  addScene: t => { const p = curPiece(); const c = p.chapters.find(x => x.id === t.dataset.id); const s = { id: uid(), title: 'Adegan ' + (c.scenes.length + 1), html: '' }; c.scenes.push(s); U.sceneId = s.id; touch(p); render(); },
  renChapter: t => { const p = curPiece(); const c = p.chapters.find(x => x.id === t.dataset.id); openDialog(`<h2>Ganti nama bab</h2><label class="f">Nama bab<input class="in" id="chName" value="${esc(c.title)}"></label><div class="row" style="justify-content:flex-end"><button class="btn quiet" data-act="dlgClose">Batal</button><button class="btn" data-act="saveChName" data-id="${c.id}">Simpan</button></div>`); },
  saveChName: t => { const p = curPiece(); const c = p.chapters.find(x => x.id === t.dataset.id); c.title = $('#chName').value.trim() || c.title; touch(p); closeDialog(); render(); },
  moveChapter: t => { const p = curPiece(); const i = p.chapters.findIndex(x => x.id === t.dataset.id); const j = i + +t.dataset.d; if (j < 0 || j >= p.chapters.length) return; [p.chapters[i], p.chapters[j]] = [p.chapters[j], p.chapters[i]]; touch(p); render(); },
  delChapter: async t => { const p = curPiece(); const c = p.chapters.find(x => x.id === t.dataset.id); if (!(await ask('Hapus bab “' + c.title + '” beserta semua adegannya?', 'Hapus', true))) return; p.chapters = p.chapters.filter(x => x !== c); cleanFootnotes(p); p.lastWords = pieceWords(p); U.sceneId = null; touch(p); render(); },
  moveScene: t => { const p = curPiece(); const c = sceneChapter(p, t.dataset.id); const i = c.scenes.findIndex(x => x.id === t.dataset.id); if (i <= 0) return; [c.scenes[i - 1], c.scenes[i]] = [c.scenes[i], c.scenes[i - 1]]; touch(p); render(); },
  delScene: async t => { const p = curPiece(); const c = sceneChapter(p, t.dataset.id); const s = c.scenes.find(x => x.id === t.dataset.id); if (htmlText(s.html).trim() && !(await ask('Hapus adegan “' + s.title + '” beserta isinya?', 'Hapus', true))) return; c.scenes = c.scenes.filter(x => x !== s); if (!c.scenes.length) p.chapters = p.chapters.filter(x => x !== c); cleanFootnotes(p); p.lastWords = pieceWords(p); U.sceneId = null; touch(p); render(); },
  fmt: t => edFormat(t.dataset.c),
  addFn: () => addFootnote(),
  fnBack: t => { const s = $(`#ed sup.fn[data-fn="${CSS.escape(t.dataset.id)}"]`); if (s) { s.scrollIntoView({ block: 'center', behavior: 'smooth' }); const r = document.createRange(); r.setStartAfter(s); r.collapse(true); $('#ed').focus(); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } },
  wide: () => { const any = U.ed.left || U.ed.right; U.ed.left = !any; U.ed.right = !any; render(); },
  hideL: () => { U.ed.left = false; render(); }, showL: () => { U.ed.left = true; render(); },
  hideR: () => { U.ed.right = false; render(); }, showR: () => { U.ed.right = true; render(); },
  edTab: t => { U.ed.tab = t.dataset.t; render(); },
  addChar: () => { const p = curPiece(); p.chars.push({ id: uid(), name: '', role: '', ideal: '', family: '', note: '' }); touch(p); render(); const ins = $$('[data-k="name"][data-in="charF"]'); if (ins.length) ins[ins.length - 1].focus(); },
  delChar: t => { const p = curPiece(); p.chars = p.chars.filter(c => c.id !== t.dataset.id); touch(p); render(); },
  // Pomodoro
  pomoToggle: () => { U.ed.pomoOpen = !U.ed.pomoOpen; if (!U.ed.pomoOpen) U.pset = null; render(); },
  pomoMode: t => { pomoStop(); P.mode = +t.dataset.i; P.left = pomoDurs()[P.mode] * 60; render(); },
  pomoRun: () => { if (P.running) pomoStop(); else pomoStart(); render(); },
  pomoReset: () => { pomoStop(); P.left = pomoDurs()[P.mode] * 60; if (P.mode === 0) P.elapsed = 0; render(); },
  pomoEnd: () => { pomoStop(); if (P.mode === 0) finishSession(); else { P.mode = 0; P.left = pomoDurs()[0] * 60; } U.ed.pomoOpen = false; render(); },
  pomoSet: () => { U.pset = U.pset ? null : { d: pomoDurs().map(String), c: S.settings.pomo.cycle }; render(); },
  psPreset: t => { U.pset.d[+t.dataset.i] = t.dataset.m; render(); },
  psCycle: t => { U.pset.c = Math.max(2, Math.min(8, U.pset.c + +t.dataset.d)); render(); },
  psSave: () => { if (!U.pset.d.every(validMin)) { toast('Perbaiki durasi yang belum benar dulu.'); return; } S.settings.pomo = { durs: U.pset.d.map(x => parseInt(x, 10)), cycle: U.pset.c }; U.pset = null; if (!P.running) P.left = pomoDurs()[P.mode] * 60; markDirty(); render(); },
  rfFeel: t => { U.reflect.feel = t.dataset.f; render(); },
  rfEnergy: t => { U.reflect.energy = +t.dataset.n; render(); },
  rfSkip: () => { U.reflect = null; render(); },
  rfSave: () => { const r = U.reflect, s = S.sessions.find(x => x.id === r.sid); if (s) { s.feel = r.feel; s.energy = r.energy || null; s.block = ($('#rfBlock') || {}).value || ''; } U.reflect = null; markDirty(); toast('Refleksi tersimpan ke rapor evaluasi'); render(); },
  // Sinkron
  syncAction: () => syncAction(),
  installApp: async () => { if (!deferredInstall) return; deferredInstall.prompt(); try { await deferredInstall.userChoice; } catch (e) { } deferredInstall = null; render(); },
  saveNow: () => { if (META.dirty || !META.fileId) saveDrive(); else loadFromDrive(); },
  useRemote: () => { if (!pendingRemote) return closeDialog(); S = pendingRemote.data; META.fileId = pendingRemote.id; META.dirty = false; pendingRemote = null; saveLocal(); closeDialog(); setSync('ok', 'Tersimpan di Drive'); render(); },
  useLocal: () => { pendingRemote = null; closeDialog(); saveDrive(); }
};
async function calSync(c) {
  if (!c.cal || !c.cal.on || !STORE || !STORE.hasCalendar) return;
  if (!c.deadline) { toast('Isi tanggal tenggat dulu untuk menautkan ke kalender.'); return; }
  try { c.cal.eventId = await STORE.calUpsert(c); markDirty(); if (U.view === 'lomba') render(); toast('Google Calendar diperbarui'); }
  catch (e) { toast(calErr(e)); }
}
function calErr(e) { return e && e.code === 'needs_auth' ? 'Masuk lagi ke Google dulu (tombol di sidebar), lalu coba lagi.' : e && e.code === 'offline' ? 'Sedang offline. Coba tautkan lagi saat tersambung.' : 'Google Calendar menolak: ' + ((e && e.message) || 'galat tidak dikenal'); }
function rakGo(i) {
  const total = Math.max(1, Math.ceil(S.pieces.filter(p => (!U.rak.cat || p.type === U.rak.cat) && (U.rak.stage === 'Semua' || p.stage === U.rak.stage) && (!U.rak.q.trim() || (p.title || '').toLowerCase().includes(U.rak.q.trim().toLowerCase()))).length / 7));
  if (i < 0 || i >= total) return; U.rak.page = i;
  const tr = $('.track'); if (tr) { $$('.page.off').forEach(x => x.classList.remove('off')); tr.style.transform = `translateX(-${i * 100}%)`; setTimeout(render, 420); } else render();
}
function setContestStatus(c, st) {
  if (c.status === st) return;
  const wasOpen = ['Mengincar', 'Disiapkan'].includes(c.status);
  c.status = st;
  if (st === 'Terkirim' && wasOpen) {
    c.sentAt = c.sentAt || today();
    S.pieces.filter(p => p.contestId === c.id).forEach(p => {
      if (!S.pubs.some(x => x.pieceId === p.id && x.cat === 'Lomba' && x.place === c.name)) S.pubs.push({ id: uid(), at: Date.now(), pieceId: p.id, title: '', cat: 'Lomba', place: c.name, date: c.sentAt, status: 'Menunggu', url: c.link || '' });
    });
  }
  if ((st === 'Menang' || st === 'Tidak lolos')) S.pubs.forEach(x => { if (x.cat === 'Lomba' && x.place === c.name && x.status === 'Menunggu') x.status = st === 'Menang' ? 'Terbit' : 'Ditolak'; });
}
function setStage(s) {
  const p = curPiece(); if (!p || p.stage === s) return;
  if (p.stage === 'Persiapan' && s !== 'Persiapan' && !prepOK(p)) { const e = $('#prepErr'); if (e) { e.hidden = false; e.scrollIntoView({ block: 'center', behavior: 'smooth' }); } else toast('Lengkapi semua butir persiapan dulu.'); return; }
  if (s === 'Terkirim') return markSent();
  p.stage = s; touch(p); render(); window.scrollTo(0, 0);
}
function markSent() {
  const p = curPiece(); if (!p) return;
  if (p.stage === 'Persiapan' && !prepOK(p)) { toast('Lengkapi semua butir persiapan dulu.'); return; }
  p.stage = 'Terkirim';
  const c = p.contestId && contestById(p.contestId);
  if (c && ['Mengincar', 'Disiapkan'].includes(c.status)) { setContestStatus(c, 'Terkirim'); toast('Ditandai terkirim. Lomba dan Jejak publikasi ikut diperbarui.'); }
  else toast('Ditandai terkirim. Catat tempat kirimnya di Jejak publikasi.');
  touch(p); render();
}
document.addEventListener('mousedown', e => { if (e.target.closest('[data-keep]')) e.preventDefault(); });
document.addEventListener('click', e => {
  const sup = e.target.closest('#ed sup.fn');
  if (sup) { const t = $(`[data-in="fnText"][data-id="${CSS.escape(sup.getAttribute('data-fn'))}"]`); if (t) { t.scrollIntoView({ block: 'center', behavior: 'smooth' }); t.focus(); } return; }
  const t = e.target.closest('[data-act]'); if (!t) { if (U.ed.pomoOpen && !e.target.closest('.pop')) { U.ed.pomoOpen = false; U.pset = null; render(); } return; }
  if (t.tagName === 'A' && t.dataset.act === 'go') e.preventDefault();
  const fn = A[t.dataset.act]; if (fn) fn(t, e);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const k = f.dataset.form;
  if (k === 'quickIdea') { const v = $('#qIdea').value.trim(); if (!v) return; S.ideas.push({ id: uid(), text: v, type: 'lain', at: Date.now() }); markDirty(); render(); toast('Ide tersimpan'); }
  else if (k === 'idea') { const v = $('#idText').value.trim(); if (!v) return; S.ideas.push({ id: uid(), text: v, type: $('#idType').value, at: Date.now() }); markDirty(); render(); }
  else if (k === 'todo') { const v = $('#tdText').value.trim(); if (!v) return; S.todos.push({ id: uid(), text: v, pieceId: $('#tdPiece').value, due: $('#tdDue').value, done: false, at: Date.now() }); markDirty(); render(); const n = $('#tdText'); if (n) n.focus(); }
  else if (k === 'edTodo') { const p = curPiece(); const v = $('#etText').value.trim(); if (!v || !p) return; S.todos.push({ id: uid(), text: v, pieceId: p.id, due: '', done: false, at: Date.now() }); markDirty(); render(); const n = $('#etText'); if (n) n.focus(); }
});

/* ============ Masukan & perubahan ============ */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'ed') { onEditorInput(); return; }
  if (t.tagName === 'TEXTAREA') grow(t);
  const k = t.dataset && t.dataset.in; if (!k) return;
  const p = curPiece();
  if (k === 'rakQ') { U.rak.q = t.value; U.rak.page = 0; render(); return; }
  if (k === 'psMin') { U.pset.d[+t.dataset.i] = t.value; t.classList.toggle('bad', !validMin(t.value)); return; }
  if (k === 'contestF') { const c = contestById(t.dataset.id); if (c) { c[t.dataset.k] = t.value; markDirty(); } return; }
  if (!p) return;
  if (k === 'pTitle') p.title = t.value;
  else if (k === 'pTarget') { p.target = t.value; updatePosMarks(); updateWordLine(); }
  else if (k === 'pNotes') p.notes = t.value;
  else if (k === 'prep') { prepVals(p)[t.dataset.i] = t.value; updatePrepGate(); }
  else if (k === 'step') { const a = stepVals(p); a[+t.dataset.k] = t.value; updatePrepGate(); }
  else if (k === 'sceneTitle') { const s = curScene(p); s.title = t.value; const b = $(`.sc[data-id="${s.id}"] span:last-child`); if (b) b.textContent = t.value || 'Tanpa judul'; }
  else if (k === 'fnText') p.fns[t.dataset.id] = t.value;
  else if (k === 'charF') { const c = p.chars.find(x => x.id === t.dataset.id); if (c) c[t.dataset.k] = t.value; }
  touch(p);
});
document.addEventListener('change', e => {
  const t = e.target, k = t.dataset && t.dataset.ch; if (!k) return;
  const p = curPiece();
  if (k === 'todo') { const x = S.todos.find(y => y.id === t.dataset.id); if (x) { x.done = t.checked; markDirty(); render(); } }
  else if (k === 'contestStatus') { const c = contestById(t.dataset.id); setContestStatus(c, t.value); markDirty(); render(); }
  else if (k === 'evPiece') { U.ev.piece = t.value; render(); }
  else if (!p) return;
  else if (k === 'pType') { p.type = t.value; touch(p); render(); }
  else if (k === 'pContest') { p.contestId = t.value; const c = contestById(t.value); if (c && c.status === 'Mengincar') c.status = 'Disiapkan'; touch(p); render(); }
  else if (k === 'check') { p.checks[t.dataset.k] = t.checked; touch(p); }
});
document.addEventListener('paste', e => {
  if (!e.target.closest || !e.target.closest('#ed')) return;
  e.preventDefault();
  const txt = (e.clipboardData || window.clipboardData).getData('text/plain');
  const html = txt.split(/\n{2,}/).map(par => '<p>' + esc(par).replace(/\n/g, '<br>') + '</p>').join('');
  document.execCommand('insertHTML', false, html);
});

/* ============ Geser ============ */
let swX = null, swEl = null;
document.addEventListener('pointerdown', e => { const el = e.target.closest('[data-swipe]'); if (el) { swX = e.clientX; swEl = el.dataset.swipe; } });
document.addEventListener('pointerup', e => {
  if (swX === null) return; const dx = e.clientX - swX, w = swEl; swX = null; swEl = null;
  if (Math.abs(dx) < 50) return;
  if (w === 'rak') rakGo(U.rak.page + (dx < 0 ? 1 : -1));
  else if (w === 'left' && dx < 0) { U.ed.left = false; render(); }
  else if (w === 'right' && dx > 0) { U.ed.right = false; render(); }
  else if (w === 'lstrip' && dx > 0) { U.ed.left = true; render(); }
  else if (w === 'rstrip' && dx < 0) { U.ed.right = true; render(); }
});
let wheelT = 0;
document.addEventListener('wheel', e => {
  if (!e.target.closest || !e.target.closest('[data-swipe="rak"]')) return;
  if (Math.abs(e.deltaX) < 30 || Math.abs(e.deltaX) < Math.abs(e.deltaY)) return;
  const n = Date.now(); if (n - wheelT < 700) return; wheelT = n;
  rakGo(U.rak.page + (e.deltaX > 0 ? 1 : -1));
}, { passive: true });

/* ============ Versi website: lanjutkan sinkron pada ketukan pertama ============ */
let resumeTried = false;
document.addEventListener('pointerdown', e => {
  if (resumeTried || !STORE || STORE.kind !== 'google' || STORE.ready || !META.gConnected || !navigator.onLine) return;
  if (e.target.closest && e.target.closest('[data-act="syncAction"]')) return;
  resumeTried = true; syncAction();
}, true);

/* ============ Mulai ============ */
(async function boot() {
  const local = await loadLocal();
  if (local) { S = normalize(local.S); Object.assign(META, local.META || {}); }
  P.left = pomoDurs()[0] * 60;
  let h = location.hash.slice(1); const hm = /^lomba\/(.+)$/.exec(h); if (hm) { h = 'lomba'; U.lomba.sel = hm[1]; }
  if (VIEWS.some(x => x[0] === h)) U.view = h;
  ofaPublish();
  render();
  initSync();
})();

</script>
